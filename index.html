市成為軍政府州的痛點。軍政府州在技術競爭中強大，但石油等資源有限，需依賴其他州進行補給。\\n\\n\\n\\n---\\n\\n3. 國家工團州（科技與新能源產業）\\n\\n州長：卡爾\\n\\n地形：平原、內陸湖，環保城鎮\\n\\n資源：高科技產業（AI、半導體）、新能源（核能、氫能）\\n\\n科技：人工智慧、核能、氫能\\n\\n影響：國家工團州需要核燃料，而新自由州控制著這些資源，雙方經常發生競爭。其強大的計劃經濟讓該區成為高科技與新能源的重要基地。\\n\\n\\n\\n---\\n\\n4. 新自由州（重工業與生物科技）\\n\\n州長：辣醬人\\n\\n地形：平原、部分丘陵\\n\\n資源：特殊合金、奈米科技、基因工程\\n\\n科技：奈米技術、基因工程\\n\\n影響：新自由州試圖發展基因科技，但國家工團州壟斷關鍵技術，雙方相互競爭。石油和特殊合金是其生物醫療和重工業的關鍵資源。\\n\\n\\n\\n---\\n\\n5. 恩瓦那州（金融與區塊鏈經濟）\\n\\n州長：高幡睦彥。托派\\n\\n地形：山區、河谷\\n\\n資源：區塊鏈產業、去中心化銀行、數位貿易\\n\\n科技：數位貨幣、去中心化金融\\n\\n影響：托派州的電子金融科技需要法西斯州的稀土，但兩者的意識形態敵對。其區塊鏈技術在全球金融體系中占有重要地位。\\n\\n\\n\\n---\\n\\n6. 宥梓芻州（航太與太空產業）\\n\\n州長：雷龍，日耳曼。法西斯主義\\n\\n地形：內陸高地、大型發射場\\n\\n資源：火箭工業、衛星科技、太空探索\\n\\n科技：火箭、衛星科技\\n\\n影響：法西斯州的太空計畫需要托派州的新能源，而托派州擅長封鎖交易。其太空科技成為國際關注的焦點，並承擔著全球發射衛星業務。\\n\\n\\n\\n---\\n\\n7. 男娘瑞典斯坦伊斯蘭fika社會民主主義人民洲（Femboyssverige stansIslamsfikassocialdemokratisfolketskontinent）（教育與醫療中心）\\n\\n州長：阿福。社民主義\\n\\n地形：平原、湖泊，宜居環境\\n\\n資源：高等教育、醫藥研發、文化產業\\n\\n科技：醫療技術、文化產業\\n\\n影響：社民州的醫療技術需要傳英社州的藥物原料，兩者時常因藥價問題對抗。擁有全球頂尖的教育與醫療資源，是區域內重要的科技與文化中心。\\n\\n\\n\\n---\\n\\n8. 人民忠誠社會主義聯邦指導區（貿易與金融中心）\\n\\n州長：鏡瓜。英國社會主義\\n\\n地形：大平原、商業城市\\n\\n資源：國際銀行、全球貿易樞紐、人工智慧商業分析\\n\\n科技：全球貿易、金融業\\n\\n影響：英社州擁有全球貿易體系，但社民州的醫療知識產權是必須合作的領域。其國際貿易體系與金融機構是該國最強大的競爭優勢。logseq____&quot;,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Flogseq____&quot;,111,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Xlogseq____&quot;,111,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Vlogseq____&quot;,111,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Ulogseq____&quot;,41,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Ulogseq____&quot;,87,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^Ulogseq____&quot;,111,536870930]],[logseq____&quot;^15logseq____&quot;,[112,logseq____&quot;^:logseq_ n史官註記：「安迪怎麼知道私人伺服器裡的東西」\\n史官註記：「而且咪卡會沒事多一堆身分組是安迪自己機器人的問題，此事不只發生在咪卡身上，也發生在其他之後進群的人身上」\\n\\n...lckyflag-雷龍-農夫樹在八校前進指揮部的核彈討論細節、主流結論logseq____&quot;,536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^Flogseq____&quot;,289,536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^Xlogseq____&quot;,151,536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^Vlogseq____&quot;,151,536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^Ulogseq____&quot;,151,536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^17logseq____&quot;,4],536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^Jlogseq____&quot;,[],536870942]],[logseq____&quot;^15logseq____&quot;,[296,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u68177e10-15cc-44ec-bf2a-284f3d0b18c4logseq____&quot;,536870942]],[logseq____&quot;^15logseq____&quot;,[297,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;#### 事件後影響\\n事後，安迪於他經營八校Discord群頒布公告：\\n```markdown!\\n昨日在七點二十左右， 一位新加入的中山女高高三生咪卡無預警的增加很多身份並且更動伺服器設定，連同校際交流群的數個同學開始在各頻道破壞既有秩序，並在午夜時此為中山女高高三生在伺服器上揚言意圖攻擊伺服器（俗稱炸群），校際交流群的群主意圖使伺服器分裂開始煽動仇恨製造對立。\\n在此之後一開始跟我們跟本人和相關性的中山女高高三生加入煽動仇恨行列，\\n與數個本在伺服器擔任意見領袖者在私人伺服器計畫讓此崩潰無法使用，\\n在私人伺服器中明確表明其幼稚且無意義行動，\\n表面上表示希望此伺服器權力下放讓更多責任能夠分擔，\\n其暗中確實在盤算如何讓此消失已達到目的。\\n```\\n![image](https://hackmd.io/_uploads/SkJSjOyelg.png)\\n關於安迪之公告，有幾處不合理地方，如下：\\n1. ***無預警...更動伺服器設定***：第一天用DC才會覺得這是可能的，**非擁有管理員權限無法更動任何伺服器設定**，事實上以上校際成員均無管理員權限或管理伺服器等權限。\\n2. ***校際交流群的數個同學開始在各頻道破壞既有秩序***：這圖上只有一個是校際原生成員，然後第一次知道聊天算一種破壞秩序 (沒有洗版)(也許跑來八校聊天就破壞他們的聊天習慣，所以破壞秩序😉)\\n3. ***校際交流群的群主意圖...***：農夫樹不是校際交流群群主🙃[~~來源請求~~ 補了](https://cdn.discordapp.com/attachments/1366424646530105414/1367162316768149664/image.png?ex=681394a0logseq____&amp;is=68124320logseq____&amp;hm=f10b6b8ca6586d52324074acc1e98 ot;,logseq____&quot;^16logseq____&quot;,536870942]],[logseq____&quot;^15logseq____&quot;,[298,logseq____&quot;^Flogseq____&quot;,293,536870942]],[logseq____&quot;^15logseq____&quot;,[298,logseq____&quot;^Xlogseq____&quot;,151,536870942]],[logseq____&quot;^15logseq____&quot;,[298,logseq____&quot;^Vlogseq____&quot;,151,536870942]],[logseq____&quot;^15logseq____&quot;,[298,logseq____&quot;^Ulogseq____&quot;,151,536870942]],[logseq____&quot;^15logseq____&quot;,[298,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u68177e10-2dee-456c-8b5b-82abfc4146f9logseq____&quot;,536870942]],[logseq____&quot;^15logseq____&quot;,[299,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;### 12月6日 — 《戒嚴令》\\n\\n因韓國傻逼尹大統領頒布於12月3日《戒嚴令》，爾後校際於12月6日模仿亦頒布《校際戒嚴令第壹號》，該戒嚴令全文如下：\\n[[**校際交流群戒嚴令全文**\\n```markdown!\\n身為群主，我懷著痛心疾首的心情向各位尊敬的群友懇切呼籲。\\n\\n自本屆管理員委員會成立以來，群代大會已提出了22起針對管理員的彈劾案，而\\n今年6月第22屆群代大會成立後，又開始推動第10名官員的彈劾。這種情況在全DC範圍內都前所未有，\\n也是自建群以來絕無僅有的事態。\\n如今，群代大會不僅威脅檢舉區，對多名檢察官進行彈劾，致使法院運作陷入癱瘓，\\n還嘗試彈劾行政安全部長、廣播語音委員會主席、硝基發放院長和群防部長，\\n讓行政部門也無法正常運作。\\n\\n在國家預算方面，他們削減了所有與國家核心功能、腦腐犯罪打擊及群組治安維護相關的重要預算。\\n這種行為不僅破壞了國家基本功能，還將韓國推向腦腐氾濫的深淵，並讓民生治安陷入恐慌狀態。\\n在明年的預算案中，自由民主黨削減了1萬億英鎊的炸群應對準備金、384億英鎊的結婚補貼、\\n失業就業項目以及深海潛水員開發等總計達4.1萬億英鎊的預算，甚至連提高伺服器初級幹部薪資和津貼、\\n當值工作補貼等軍官待遇改善費用也遭遇阻礙。\\n這種預算暴行簡直是在玩弄國家財政。他們甚至將預算作為黨派鬥爭的工具，這種行為體現了\\n自由民主黨毫不猶豫地實施預算案「彈劾」的立法獨裁。\\n群政因此癱瘓，群友的嘆息與日俱增。這是對自由校際交流群憲政秩序的踐踏，也是擾亂\\n根據憲法與法律運作的群組機關的行為，已構成顯而易見的叛群行為。\\n\\n他們完全無視群友的生活，將群政陷入癱瘓，只關注彈劾、特別檢察以及為反對黨領袖「護航」。\\n現今的群代大會已淪為犯罪集團的巢穴，\\n透過立法獨裁癱瘓國家司法行政系統，並試圖顛覆自由民主制度。\\n本應成為自由民主主義基礎的群代大會，卻變成了摧毀自由民主制度的怪物。\\n現今的校際交流群處於風雨飄搖的境地，隨時可能崩塌。\\n\\n親愛的群友們，我為捍衛自由校際交流群免受八校共產勢力的威脅，\\n為肅清那些掠奪群友自由與幸福的無恥安迪反群勢力，為守護自由憲政秩序，\\n特此宣布進入緊急戒嚴狀態。\\n透過這項緊急戒嚴，我將重建並保衛正走向死群深淵的自由校際交流群。\\n為此，我必將徹底肅清那些危害群組的元兇與反群組勢力。\\n這是為了保護群友的自由與安全，確保群組的永續發展，\\n並將一個完善的群組留給未來世代所採取的不得已之舉。\\n我將盡快肅清反群組勢力並恢復群組正常運作。\\n儘管緊急戒嚴可能會對相信並遵守自由校際交流群憲法價值的善良群友\\n帶來諸多不便，但我會盡全力將這些不便降到最低。\\n\\n此舉是為了保障自由校際交流群的長遠發展，不得已而為之，\\n且不會改變我們對群際社會的責任與貢獻這一對外政策基調。\\n身為群主，我懇請群友的理解與支持。我唯有相信群友，並全心投入，\\n捍衛自由校際交流群。請相信我。謝謝。\\n\\n群主 農夫樹\\n```\\n\\n因為八校事件       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
